[project]
name = "extraction-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vinicius Azambuja", email = "vnazambuja@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.60.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.30.0",
    "google-auth-httplib2>=0.2.0",
    "pypdf>=4.0.0",
    "pytest>=8.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.16.1",
]

[project.scripts]
extraction-agent = "extraction_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
